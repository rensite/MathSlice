# Included inside nginx's http context by the standard nginx image.
map "$status:$uri" $sectionlab_cache {
    default "no-cache";
    "~^(200|304):/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Keep all add_header directives at the same level (inheritance matters).
    add_header Cache-Control $sectionlab_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    # No client-side path router: missing assets/pages must return 404, not HTML.
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
